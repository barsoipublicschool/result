<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Wise Marks Entry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .main-card { max-width: 800px; margin: 30px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .table-responsive { max-height: 500px; overflow-y: auto; }
    .mark-input { width: 90px; text-align: center; font-weight: bold; }
    .sticky-header th { position: sticky; top: 0; background-color: #0d6efd; color: white; z-index: 2; }
  </style>
</head>
<body>

<div class="container">
  <div class="card main-card p-4 bg-white">
    <h3 class="text-center text-primary fw-bold mb-4">Subject-Wise Marks Entry</h3>
    
    <!-- Class and Subject Selection -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label for="classSelect" class="form-label fw-bold">Select Class:</label>
        <select id="classSelect" class="form-select" onchange="onClassChange()">
          <option value="">-- Choose Class --</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="subjectSelect" class="form-label fw-bold">Select Subject:</label>
        <select id="subjectSelect" class="form-select" onchange="loadStudents()" disabled>
          <option value="">-- Choose Subject --</option>
        </select>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loader" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted fw-semibold">Loading students data...</p>
    </div>

    <!-- Student List Table -->
    <form id="marksForm" class="d-none" onsubmit="saveMarks(event)">
      <div class="table-responsive border rounded mb-3">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="sticky-header">
            <tr>
              <th style="width: 15%;">Roll No</th>
              <th style="width: 55%;">Student Name</th>
              <th style="width: 30%;" class="text-center">Marks Input</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Dynamic rows will render here -->
          </tbody>
        </table>
      </div>

      <div class="d-grid gap-2 d-md-flex justify-md-end mt-3">
        <button type="submit" id="saveBtn" class="btn btn-success px-5 py-2 fw-bold">Save & Submit Marks</button>
      </div>
    </form>

    <!-- Status Alert -->
    <div id="statusAlert" class="mt-3 alert d-none"></div>
  </div>
</div>

<script>
  // Apne Web App ka deployed URL yahan paste karein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtFRenRImWHJs7rKHXiplR7ZvSNO_m8zSe38OjdPmOdf1cS1zi7niVYVv1zQjBooBbRw/exec";

  // 1. Page load hone par Classes Tab fetch karna
  window.onload = function() {
    fetch(`${SCRIPT_URL}?action=getClasses`)
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          const classSelect = document.getElementById("classSelect");
          data.classes.forEach(cls => {
            let opt = document.createElement("option");
            opt.value = cls;
            opt.textContent = cls;
            classSelect.appendChild(opt);
          });
        }
      });
  };

  // 2. Class Select karne par Subjects fetch karna
  function onClassChange() {
    const className = document.getElementById("classSelect").value;
    const subjectSelect = document.getElementById("subjectSelect");
    const marksForm = document.getElementById("marksForm");
    
    subjectSelect.innerHTML = '<option value="">-- Choose Subject --</option>';
    subjectSelect.disabled = true;
    marksForm.classList.add("d-none");

    if(!className) return;

    fetch(`${SCRIPT_URL}?action=getSubjects&className=${encodeURIComponent(className)}`)
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          data.subjects.forEach(sub => {
            let opt = document.createElement("option");
            opt.value = sub;
            opt.textContent = sub;
            subjectSelect.appendChild(opt);
          });
          subjectSelect.disabled = false;
        }
      });
  }

  // 3. Subject select karne par Bachchon ki list aur unka Marks load karna
  function loadStudents() {
    const className = document.getElementById("classSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    const loader = document.getElementById("loader");
    const marksForm = document.getElementById("marksForm");
    const tbody = document.getElementById("studentTableBody");

    if(!className || !subject) {
      marksForm.classList.add("d-none");
      return;
    }

    loader.classList.remove("d-none");
    marksForm.classList.add("d-none");
    tbody.innerHTML = "";

    fetch(`${SCRIPT_URL}?action=getStudents&className=${encodeURIComponent(className)}&subject=${encodeURIComponent(subject)}`)
      .then(res => res.json())
      .then(data => {
        loader.classList.add("d-none");
        if(data.status === "success") {
          marksForm.classList.remove("d-none");

          data.students.forEach(std => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
              <td class="fw-bold">${std.rollNo}</td>
              <td>${std.name}</td>
              <td class="text-center">
                <input type="number" 
                       class="form-control form-control-sm mark-input mx-auto" 
                       data-row="${std.rowNum}" 
                       value="${std.mark}" 
                       min="0" max="100" 
                       placeholder="0">
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      })
      .catch(err => {
        loader.classList.add("d-none");
        alert("Data load karne me problem aayi!");
      });
  }

  // 4. Marks Save & Submit Karna
  function saveMarks(e) {
    e.preventDefault();
    const className = document.getElementById("classSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    const saveBtn = document.getElementById("saveBtn");
    const alertBox = document.getElementById("statusAlert");

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving to Sheet...";

    const markInputs = document.querySelectorAll(".mark-input");
    const marksData = [];

    markInputs.forEach(input => {
      marksData.push({
        rowNum: input.getAttribute("data-row"),
        mark: input.value
      });
    });

    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        className: className,
        subject: subject,
        marksData: marksData
      })
    })
    .then(res => res.json())
    .then(res => {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save & Submit Marks";

      alertBox.classList.remove("d-none", "alert-danger", "alert-success");
      if(res.status === "success") {
        alertBox.classList.add("alert-success");
        alertBox.textContent = `Success: ${className} ke ${subject} subject ke marks save ho gaye!`;
      } else {
        alertBox.classList.add("alert-danger");
        alertBox.textContent = "Error: " + res.message;
      }
    })
    .catch(err => {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save & Submit Marks";
      alertBox.classList.remove("d-none");
      alertBox.classList.add("alert-danger");
      alertBox.textContent = "Server connection error.";
    });
  }
</script>

</body>
</html>
