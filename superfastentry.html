<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BARSOI PUBLIC SCHOOL - Marks Entry Portal</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert2 CSS & JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    :root {
      --school-green: #1b4332;
      --school-title: #2d6a4f;
      --banner-dark: #2c3e50;
    }
    
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #eef2f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body { 
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 0;
    }

    .main-card { 
      width: 100%;
      max-width: 900px;
      height: 100vh;
      border: none;
      border-radius: 0; 
      background: #ffffff; 
      display: flex;
      flex-direction: column;
      overflow: visible !important;
      margin: auto;
    }

    @media (min-width: 768px) {
      body { padding: 15px; align-items: center; }
      .main-card {
        height: 95vh;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      }
    }
    
    .header-container { 
      padding: 12px 10px 8px 10px; 
      background: #fff; 
      text-align: center;
      flex-shrink: 0;
    }

    .school-title { 
      color: var(--school-title); 
      font-weight: 800; 
      font-size: clamp(1.2rem, 4.5vw, 1.8rem); 
      letter-spacing: 0.5px; 
      margin-bottom: 2px; 
      line-height: 1.1;
      text-transform: uppercase;
    }

    .trust-title { 
      font-weight: 700; 
      font-size: clamp(0.75rem, 2.5vw, 0.95rem); 
      color: var(--school-green); 
      margin-bottom: 2px; 
      text-transform: uppercase; 
    }

    .school-details { 
      font-size: clamp(0.68rem, 2vw, 0.8rem); 
      color: #333333; 
      font-weight: 600; 
      line-height: 1.3; 
    }

    .school-email { color: #0d6efd; font-weight: 700; }
    
    .banner-strip { 
      background: var(--banner-dark); 
      color: #ffffff; 
      text-align: center; 
      padding: 6px 10px; 
      font-weight: 700; 
      font-size: clamp(0.85rem, 2.8vw, 1.05rem); 
      letter-spacing: 1px; 
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .form-section { 
      padding: 10px 12px; 
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .controls-row { flex-shrink: 0; margin-bottom: 8px; }
    .form-label { margin-bottom: 2px; font-size: 0.85rem; }

    .form-select {
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 16px !important;
      border: 1.5px solid #cbd5e1;
    }

    #marksForm {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      overflow: hidden;
    }

    .status-bar { flex-shrink: 0; margin-bottom: 6px; }

    .table-responsive { 
      flex-grow: 1;
      overflow-y: auto; 
      border: 1px solid #dee2e6; 
      border-radius: 8px; 
      margin-bottom: 8px;
    }

    .sticky-header th { 
      position: sticky; 
      top: 0; 
      background-color: #0d6efd; 
      color: white; 
      z-index: 2; 
      text-align: left; 
      padding: 10px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .mark-input { 
      width: 80px; 
      text-align: center; 
      font-weight: 700; 
      font-size: 1.05rem !important; 
      padding: 4px 6px;
      border-radius: 6px;
    }

    .submit-container { flex-shrink: 0; padding-top: 2px; }

    .btn-submit {
      background-color: #0d6efd;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      padding: 10px 20px;
      font-size: 1rem;
      width: 100%;
    }

    #saveIndicator {
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="main-card">
  
  <!-- Header Section -->
  <div class="header-container">
    <h1 class="school-title">BARSOI PUBLIC SCHOOL</h1>
    <div class="trust-title">ZAHIR EDUCATIONAL & WELFARE TRUST</div>
    <div class="school-details">
      BARSOI, BARSOI, KATIHAR, BIHAR 855102 &nbsp;|&nbsp; UDISE :- 10101119902<br>
      <span class="school-email">Email-barsoipublicschool125@gmail.com</span>
    </div>
  </div>

  <!-- Banner Bar -->
  <div class="banner-strip">
    SUBJECT-WISE MARKS ENTRY
  </div>

  <!-- Form Section -->
  <div class="form-section">
    <div class="row g-2 controls-row">
      <div class="col-6">
        <label for="classSelect" class="form-label fw-bold text-secondary">Select Class:</label>
        <select id="classSelect" class="form-select fw-semibold" onchange="onClassChange()">
          <option value="">-- Class --</option>
        </select>
      </div>

      <div class="col-6">
        <label for="subjectSelect" class="form-label fw-bold text-secondary">Select Subject:</label>
        <select id="subjectSelect" class="form-select fw-semibold" onchange="loadStudents()" disabled>
          <option value="">-- Subject --</option>
        </select>
      </div>
    </div>

    <!-- Students Marks Table Form -->
    <form id="marksForm" class="d-none" onsubmit="submitForm(event)">
      <div class="d-flex justify-content-between align-items-center status-bar">
        <span class="text-muted small fw-bold">Instant Auto-Sync</span>
        <span id="saveIndicator" class="badge bg-success">Ready</span>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-striped align-middle mb-0">
          <thead class="sticky-header">
            <tr>
              <th style="width: 20%;">Roll No</th>
              <th style="width: 55%;">Student Name</th>
              <th style="width: 25%;" class="text-center">Marks Input</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>

      <!-- Submit Button -->
      <div class="submit-container">
        <button type="submit" id="submitBtn" class="btn btn-primary btn-submit">Submit Marks</button>
      </div>
    </form>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzKu0kPz8PhZaHp0SfWcjnOrFxZrpmjDy5c6ZemkHFr63cSa2QXX9u5G-hEtyQt9d60xg/exec";
  let autoSaveTimer = null;

  // 1. Fetch Class List on Page Load (Local Cache First)
  window.onload = function() {
    const cachedClasses = sessionStorage.getItem("cached_classes");
    if (cachedClasses) {
      populateClassSelect(JSON.parse(cachedClasses));
    }

    fetch(`${SCRIPT_URL}?action=getClasses`)
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          sessionStorage.setItem("cached_classes", JSON.stringify(data.classes));
          populateClassSelect(data.classes);
        }
      });
  };

  function populateClassSelect(classes) {
    const classSelect = document.getElementById("classSelect");
    classSelect.innerHTML = '<option value="">-- Class --</option>';
    classes.forEach(cls => {
      let opt = document.createElement("option");
      opt.value = cls;
      opt.textContent = cls;
      classSelect.appendChild(opt);
    });
  }

  // 2. Fetch Subjects on Class Change
  function onClassChange() {
    const className = document.getElementById("classSelect").value;
    const subjectSelect = document.getElementById("subjectSelect");
    const marksForm = document.getElementById("marksForm");
    
    subjectSelect.innerHTML = '<option value="">-- Subject --</option>';
    subjectSelect.disabled = true;
    marksForm.classList.add("d-none");

    if(!className) return;

    const cacheKey = "subjects_" + className;
    const cachedSubjects = sessionStorage.getItem(cacheKey);
    if(cachedSubjects) {
      populateSubjectSelect(JSON.parse(cachedSubjects));
    }

    fetch(`${SCRIPT_URL}?action=getSubjects&className=${encodeURIComponent(className)}`)
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          sessionStorage.setItem(cacheKey, JSON.stringify(data.subjects));
          populateSubjectSelect(data.subjects);
        }
      });
  }

  function populateSubjectSelect(subjects) {
    const subjectSelect = document.getElementById("subjectSelect");
    subjectSelect.innerHTML = '<option value="">-- Subject --</option>';
    subjects.forEach(sub => {
      let opt = document.createElement("option");
      opt.value = sub;
      opt.textContent = sub;
      subjectSelect.appendChild(opt);
    });
    subjectSelect.disabled = false;
  }

  // 3. Ultra Fast Student Load (Local Cache Support)
  function loadStudents() {
    const className = document.getElementById("classSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    const marksForm = document.getElementById("marksForm");
    const tbody = document.getElementById("studentTableBody");

    if(!className || !subject) {
      marksForm.classList.add("d-none");
      return;
    }

    const cacheKey = `students_${className}_${subject}`;
    const cachedStudents = sessionStorage.getItem(cacheKey);

    if(cachedStudents) {
      renderStudentRows(JSON.parse(cachedStudents));
      marksForm.classList.remove("d-none");
    } else {
      Swal.fire({
        title: 'Loading Data...',
        text: 'Fetching student list',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });
    }

    // Background Fresh Sync
    fetch(`${SCRIPT_URL}?action=getStudents&className=${encodeURIComponent(className)}&subject=${encodeURIComponent(subject)}`)
      .then(res => res.json())
      .then(data => {
        if(!cachedStudents) Swal.close();
        if(data.status === "success") {
          sessionStorage.setItem(cacheKey, JSON.stringify(data.students));
          renderStudentRows(data.students);
          marksForm.classList.remove("d-none");
        }
      })
      .catch(err => {
        if(!cachedStudents) {
          Swal.close();
          Swal.fire({ icon: 'error', title: 'Error', text: 'Network Error!' });
        }
      });
  }

  function renderStudentRows(students) {
    const tbody = document.getElementById("studentTableBody");
    tbody.innerHTML = "";
    students.forEach(std => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="fw-bold text-secondary">${std.rollNo}</td>
        <td class="fw-semibold">${std.name}</td>
        <td class="text-center">
          <input type="number" 
                 class="form-control form-control-sm mark-input mx-auto" 
                 data-row="${std.rowNum}" 
                 value="${std.mark}" 
                 min="0" max="100" 
                 placeholder="0"
                 oninput="triggerAutoSave()">
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 4. Instant Auto-Save (Debounce + Background Fetch)
  function triggerAutoSave() {
    const badge = document.getElementById("saveIndicator");
    badge.className = "badge bg-warning text-dark";
    badge.textContent = "Syncing...";
    
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => {
      saveMarksToSheet(false);
    }, 1500);
  }

  // 5. Async Post API Call
  function saveMarksToSheet(isFinalSubmit = false) {
    const className = document.getElementById("classSelect").value;
    const subject = document.getElementById("subjectSelect").value;
    const badge = document.getElementById("saveIndicator");

    if(!className || !subject) return;

    const markInputs = document.querySelectorAll(".mark-input");
    const marksData = [];

    markInputs.forEach(input => {
      marksData.push({
        rowNum: input.getAttribute("data-row"),
        mark: input.value
      });
    });

    // Local Storage Update for Immediate Consistency
    const cacheKey = `students_${className}_${subject}`;
    const cachedStudents = sessionStorage.getItem(cacheKey);
    if(cachedStudents) {
      let parsed = JSON.parse(cachedStudents);
      parsed.forEach(std => {
        const found = marksData.find(m => m.rowNum == std.rowNum);
        if(found) std.mark = found.mark;
      });
      sessionStorage.setItem(cacheKey, JSON.stringify(parsed));
    }

    if(isFinalSubmit) {
      // INSTANT SUCCESS ALERT (Zero waiting time for teacher)
      Swal.fire({
        icon: 'success',
        title: 'Submitted Successfully!',
        text: `Marks for Class ${className} (${subject}) submitted!`,
        timer: 1800,
        showConfirmButton: false
      });
    }

    // Silent Background Fetch to Google Sheet
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        className: className,
        subject: subject,
        marksData: marksData
      })
    })
    .then(res => res.json())
    .then(res => {
      if(res.status === "success") {
        badge.className = "badge bg-success";
        badge.textContent = "Saved";
      } else {
        badge.className = "badge bg-danger";
        badge.textContent = "Sync Error";
      }
    })
    .catch(err => {
      badge.className = "badge bg-danger";
      badge.textContent = "Offline";
    });
  }

  // 6. Submit Button Handler (Instant Click Response)
  function submitForm(e) {
    e.preventDefault();
    clearTimeout(autoSaveTimer);
    saveMarksToSheet(true);
  }
</script>

</body>
</html>
